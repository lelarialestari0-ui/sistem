<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Pengguna | Event Handling + Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-4">
  <div class="container">
    <h2 class="text-center fw-bold mb-4">👥 Katalog Pengguna Interaktif</h2>

    <!-- ============ FORM INPUT PENGGUNA ============ -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">
        Tambah Data Pengguna
      </div>
      <div class="card-body">
        <form id="formPengguna">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Nama Lengkap</label>
              <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-control" placeholder="Masukkan email" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Peran</label>
              <select id="peran" class="form-select" required>
                <option value="">-- Pilih Peran --</option>
                <option value="Administrator">Administrator</option>
                <option value="Editor">Editor</option>
                <option value="Viewer">Viewer</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">URL Foto Profil</label>
              <input type="url" id="foto" class="form-control" placeholder="Masukkan link foto profil" required>
            </div>
          </div>
          <div class="text-end mt-3">
            <button type="submit" class="btn btn-success">Tambah ke Katalog</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ============ OUTPUT: KATALOG PENGGUNA ============ -->
    <div class="card shadow-sm">
      <div class="card-header bg-secondary text-white">
        Daftar Pengguna
      </div>
      <div class="card-body">
        <div class="row" id="daftarPengguna">
          <!-- Data pengguna akan tampil di sini -->
        </div>
      </div>
    </div>
  </div>

  <!-- ============ SCRIPT EVENT HANDLING ============ -->
  <script>
    // Ambil elemen DOM
    const form = document.getElementById('formPengguna');
    const daftarPengguna = document.getElementById('daftarPengguna');

    // EVENT: Saat form disubmit
    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Mencegah reload halaman

      // Ambil data dari input
      const nama = document.getElementById('nama').value;
      const email = document.getElementById('email').value;
      const peran = document.getElementById('peran').value;
      const foto = document.getElementById('foto').value;

      // Validasi sederhana
      if (!nama || !email || !peran || !foto) {
        alert("Semua data wajib diisi!");
        return;
      }

      // Buat elemen kartu pengguna
      const card = document.createElement('div');
      card.classList.add('col-md-3', 'mb-4');
      card.innerHTML = `
        <div class="card h-100 shadow-sm">
          <img src="${foto}" class="card-img-top" alt="${nama}">
          <div class="card-body text-center">
            <h5 class="card-title">${nama}</h5>
            <p class="text-muted mb-1">${email}</p>
            <span class="badge bg-info text-dark">${peran}</span>
          </div>
          <div class="card-footer text-center">
            <button class="btn btn-danger btn-sm hapus">Hapus</button>
          </div>
        </div>
      `;

      // Tambahkan kartu ke katalog
      daftarPengguna.appendChild(card);

      // Reset form
      form.reset();

      // Event handling untuk tombol hapus
      const btnHapus = card.querySelector('.hapus');
      btnHapus.addEventListener('click', function() {
        card.remove();
      });
    });
  </script>
</body>
</html>
