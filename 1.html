<div class="container-md">
<form id="formData" class="bg-white p-4 rounded shadow-sm">
  <div class="row mb-3">
    <label for="email" class="col-sm-2 col-form-label">Email</label>
    <div class="col-sm-10">
      <input type="email" class="form-control" id="email">
    </div>
  </div>
  <div class="row mb-3">
    <label for="password" class="col-sm-2 col-form-label">Password</label>
    <div class="col-sm-10">
      <input type="password" class="form-control" id="password">
    </div>
  </div>

   
    <div class="col-sm-10">
                   </fieldset>
  <div class="row mb-3">
    <div class="col-sm-10 offset-sm-2">
        
  <button id="submit" class="btn btn-primary">Sign in</button>
<p id="pesan" class="mt-3 text-success fw-bold"></p>
</form>
<div class="mt-4 p-3 bg-white rounded shadow-sm">
      <h5 id="hasil">Hasil Output:</h5>
      <p id="outputEmail"></p>
      <p id="outputPassword"></p>
    </div>
  </div>
</div>
    <script>
 document.getElementById("formData").addEventListener("submit", function(event){
      event.preventDefault(); // Mencegah reload halaman
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      document.getElementById("outputEmail").textContent = "Email: " + email;
      document.getElementById("outputPassword").textContent = "Password: " + password;
    });

    document.getElementById("submit").addEventListener("click", function(){
      document.getElementById("pesan").textContent = "Berhasil Login!";
    });
  </script>
